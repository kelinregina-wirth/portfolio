<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelin Regina Wirth | Comunicação & Conteúdo Estratégico</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* --- PALETA EDITORIAL: GRAFITE & DOURADO FOSCO --- */
        :root {
            --bg-principal: #fdfcf9; /* Off-white inspirado em páginas de revistas */
            --bg-card: #ffffff; 
            --cor-primaria: #1a1c1e; /* Grafite escuro e sóbrio */
            --cor-detalhe: #b89047; /* Dourado fosco elegante */
            --texto-secundario: #5d646d; 
            --borda: #e6e2da;
            --borda-suave: #f1eee9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-principal);
            color: var(--cor-primaria);
            line-height: 1.7;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        section {
            padding: 100px 20px;
            max-width: 1140px;
            margin: 0 auto;
        }

        .titulo-secao {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 500;
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: -0.01em;
        }

        .titulo-secao span {
            color: var(--cor-detalhe);
            font-style: italic;
        }

        /* --- CABEÇALHO --- */
        header {
            background-color: rgba(253, 252, 249, 0.95);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--borda);
        }

        .nav-container {
            max-width: 1140px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .logo span {
            color: var(--cor-detalhe);
            font-weight: 400;
            font-style: italic;
        }

        nav a {
            margin-left: 25px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--texto-secundario);
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--cor-detalhe);
        }

        /* --- HERO --- */
        .hero {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
            min-height: 70vh;
            padding-top: 40px;
        }

        .hero-conteudo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 500;
            line-height: 1.2;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        .hero-conteudo h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--cor-detalhe);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .hero-conteudo p {
            font-size: 1.1rem;
            color: var(--texto-secundario);
            margin-bottom: 35px;
            max-width: 580px;
        }

        .botoes-grupo {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 2px;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }

        .btn-primario {
            background-color: var(--cor-primaria);
            color: #ffffff;
        }

        .btn-primario:hover {
            background-color: var(--cor-detalhe);
            transform: translateY(-2px);
        }

        .btn-secundario {
            border: 1px solid var(--cor-primaria);
            color: var(--cor-primaria);
        }

        .btn-secundario:hover {
            border-color: var(--cor-detalhe);
            color: var(--cor-detalhe);
            transform: translateY(-2px);
        }

        .foto-perfil-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .foto-perfil {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--borda);
            padding: 6px;
            background-color: #fff;
        }

        /* --- TEXTO DE POSICIONAMENTO HUMANO --- */
        .manifesto-secao {
            background-color: #ffffff;
            border-top: 1px solid var(--borda);
            border-bottom: 1px solid var(--borda);
            text-align: center;
        }
